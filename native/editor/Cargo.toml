[package]
name = "ad3-editor"
version = "0.1.0"
edition = "2024"
autotests = false
license = "MPL-2.0"
description = "Native Rust implementation of the AD3 Editing document and editor"

[lib]
name = "ad3_editor"

[[bin]]
name = "dapi-rust"
path = "src/main.rs"
test = false

[[bin]]
name = "ad3-editing"
path = "src/desktop.rs"
required-features = ["desktop"]
test = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
desktop = ["dep:eframe", "dep:image"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
oxc_allocator = "0.149"
oxc_ast = "0.149"
oxc_parser = "0.149"
oxc_span = "0.149"
oxc_ast_visit = "0.149"
oxc_codegen = "0.149"
oxc_semantic = "0.149"
oxc_transformer = "0.149"
boa_engine = { version = "0.22.0", default-features = false, features = ["float16", "xsum"] }
stacker = "0.1.25"
serde_yaml = "0.9"
html-escape = "0.2"
dragonbox_ecma = { version = "0.1", features = ["ecma"] }
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
tiny-skia = "0.12"

[profile.release]
lto = true
strip = true

# Keep dependency caches and development assertions while reducing the editor's
# own debug data. Dependencies may still contribute symbols to Windows PDBs.
[profile.dev.package.ad3-editor]
debug = 0
